[project]
name = "speaky-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Speaky AI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prisma>=0.15",
    "pydantic[email]>=2.9",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "aiosmtplib>=3.0",
    "httpx>=0.27",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "piper-tts>=1.3",
    "g2p-en>=2.1.0",
    "nltk>=3.9",
    "langdetect>=1.0.9",
    # Pronunciation Coach (US-95) / Accent Assessment (US-93, US-89) -- also power the
    # voice-ws realtime pipeline (lib/voice_ws.py): faster-whisper for transcription,
    # silero-vad for utterance segmentation -- see lib/recording_engine.py for how they
    # fit together for the upload-based flows.
    "faster-whisper>=1.2.1",
    "av>=13.0",
    "silero-vad>=5.1",
    "praat-parselmouth>=0.4.7",
    "numpy>=1.26",
    "pronouncing>=0.2.0",
    "torch", # Need to do explicit for torch-cpu.
    "torchaudio",
    # Live Call (two-way voice) — WebRTC transport + turn-taking orchestration for the
    # agent worker under backend/live_call/. STT/TTS/LLM stay the engines above
    # (faster-whisper, piper-tts, Groq via services/*) — LiveKit only supplies
    # transport, VAD-based turn detection, and the Agent/AgentSession runtime.
    "livekit-api>=0.8",
    "livekit-agents>=1.0",
    "livekit-plugins-silero>=1.0",
    # Optional Beyond Presence avatar (lip-synced video) — env-gated in worker.py,
    # calls stay audio-only if BEY_API_KEY isn't set.
    "livekit-plugins-bey>=1.6",
]

[tool.taskipy.tasks]
dev = "uvicorn main:app --reload"
start = "uvicorn main:app"
start-all = "uvicorn main:app --reload --host 0.0.0.0 --port 8000"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # To avoid side effects (like other projects also resolved from this index)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "taskipy>=1.2.1",
]
